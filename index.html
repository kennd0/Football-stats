<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Football Stats"><link rel="manifest" href="manifest.webmanifest">
<title>Football Stats</title>
<style>
:root{--bg:#090b10;--panel:#fff;--ink:#252936;--muted:#777d89;--line:#e8e9ed;--red:#e51d35;--green:#198b3b;--loss:#c92c25;--draw:#666;--soft:#f2f3f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}.top{height:72px;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222630;position:sticky;top:0;background:#090b10;z-index:3}.brand{font-size:20px;font-weight:850;letter-spacing:.4px}.brand span{color:var(--red)}.live{font-size:11px;color:#b8c0cc;border:1px solid #343a47;padding:6px 9px;border-radius:20px}.live i{display:inline-block;width:7px;height:7px;background:#f04444;border-radius:50%;margin-right:5px}.wrap{max-width:900px;margin:auto;padding:18px 12px 40px}.heading{display:flex;justify-content:space-between;align-items:center;margin:6px 4px 14px}.heading h1{font-size:23px;margin:0}.sub{color:#9ca3af;font-size:13px;margin-top:5px}.search{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #333947;background:#151922;color:white;font-size:16px;outline:none;margin:8px 0 14px}.filters{display:flex;gap:8px;overflow:auto;padding:0 0 14px}.chip{white-space:nowrap;border:1px solid #343a47;background:#151922;color:#d7dbe3;padding:9px 13px;border-radius:22px;font-size:13px}.chip.active{background:#fff;color:#202431;border-color:#fff;font-weight:700}.section-title{font-size:14px;color:#aeb5c2;font-weight:700;letter-spacing:.5px;margin:12px 4px}.match{background:#171c26;border:1px solid #292f3b;border-radius:13px;margin:9px 0;overflow:hidden}.matchtop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#aeb5c2;font-size:12px;border-bottom:1px solid #292f3b}.matchmain{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 14px;gap:8px}.team{font-weight:700;font-size:15px}.team:last-child{text-align:right}.score{font-size:20px;font-weight:800;white-space:nowrap}.matchfoot{display:flex;justify-content:flex-end;padding:0 14px 12px}.details{border:0;background:#252c39;color:#fff;border-radius:8px;padding:8px 12px;font-weight:650}.panel{background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;min-height:68vh;margin:18px -12px 0;overflow:hidden}.panelhead{padding:20px 18px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panelhead h2{font-size:21px;margin:0}.close{border:0;background:none;font-size:27px;color:#343a46}.tabs{display:flex;overflow:auto;border-bottom:1px solid var(--line);scrollbar-width:none}.tab{flex:1;min-width:max-content;padding:17px 13px 14px;text-align:center;color:#777;font-weight:600;border-bottom:4px solid transparent;font-size:14px}.tab.active{color:var(--ink);border-color:var(--red)}.content{padding:18px 0 30px}.content h3{text-align:center;font-size:17px;margin:5px 10px 17px}.result{display:grid;grid-template-columns:80px 1fr 62px 38px;gap:7px;align-items:center;padding:13px 14px;font-size:14px}.result:nth-child(even){background:#f3f3f5}.date{white-space:nowrap;color:#505663}.fixture{line-height:1.35}.resultscore{text-align:right;font-weight:800;white-space:nowrap}.form{display:flex;gap:4px}.badge{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:7px;color:white;font-weight:800;font-size:12px}.W{background:var(--green)}.L{background:var(--loss)}.D{background:var(--draw)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}th{background:#eeeef2;text-align:left;padding:13px 10px}td{padding:13px 10px;border-bottom:1px solid #eee}.club{font-weight:650}.highlight{background:#e9f3d7;font-weight:750}.muted{color:#737987}.facts{padding:8px 16px}.fact{display:flex;justify-content:space-between;padding:14px 2px;border-bottom:1px solid #eee}.fact b{font-variant-numeric:tabular-nums}.bar{height:7px;background:#eceef2;border-radius:8px;margin:8px 0 18px;overflow:hidden}.bar span{display:block;height:100%;background:#e51d35;border-radius:8px}.notice{font-size:12px;color:#aab1be;text-align:center;padding:16px 10px 0}.empty{text-align:center;color:#737987;padding:35px 15px}.hidden{display:none!important}@media(min-width:700px){.wrap{padding-top:28px}.panel{margin-left:0;margin-right:0;border-radius:16px}.tab{font-size:15px}.matchmain{padding:19px 18px}.team{font-size:17px}}
</style></head>
<body><header class="top"><div class="brand">FOOTBALL <span>STATS</span></div><div class="live"><i></i> PROTOTIPO · DEMO</div></header>
<main class="wrap"><div class="heading"><div><h1>Partidos</h1><div class="sub">Fútbol · Todas las competiciones</div></div></div><input id="search" class="search" placeholder="Buscar equipo o competición…" autocomplete="off"><div class="filters" id="filters"><button class="chip active" data-filter="Todos">Todos</button><button class="chip" data-filter="Champions League">Champions League</button><button class="chip" data-filter="Premier League">Premier League</button><button class="chip" data-filter="La Liga">La Liga</button><button class="chip" data-filter="Serie A">Serie A</button></div><div class="section-title">PARTIDOS DESTACADOS</div><div id="matches"></div><div class="notice">Los encuentros y estadísticas mostrados son datos de ejemplo, no resultados en directo.</div>
<section id="detail" class="panel hidden"><div class="panelhead"><div><h2 id="matchTitle">Equipo A vs Equipo B</h2><div class="sub" id="matchComp" style="color:#777"></div></div><button class="close" id="close" aria-label="Cerrar">×</button></div><nav class="tabs"><div class="tab active" data-tab="form">Últimos resultados</div><div class="tab" data-tab="h2h">Enfrentamientos</div><div class="tab" data-tab="table">Clasificación</div><div class="tab" data-tab="facts">Datos del partido</div></nav><div id="tabContent" class="content"></div></section>
</main>
<script>
const games=[
{id:1,comp:'UEFA Champions League',date:'Hoy · 20:00',home:'Real Madrid',away:'AEK Athens',score:'— : —',formHome:'WWWWW',formAway:'LLWLL'},
{id:2,comp:'Premier League',date:'Hoy · 17:30',home:'Liverpool',away:'Arsenal',score:'— : —',formHome:'WWDWW',formAway:'WDWWW'},
{id:3,comp:'La Liga',date:'Mañana · 20:00',home:'Barcelona',away:'Sevilla',score:'— : —',formHome:'WWLWW',formAway:'LWDWL'},
{id:4,comp:'Serie A',date:'Mañana · 19:45',home:'Inter',away:'Roma',score:'— : —',formHome:'WWWLW',formAway:'WLWDW'},
{id:5,comp:'UEFA Champions League',date:'Mañana · 20:00',home:'Manchester City',away:'Bayern',score:'— : —',formHome:'WDWWW',formAway:'WWDWW'}];
const standings=[['1','Paris SG','4','9','5','9','WWW'],['2','Villa','4','9','3','9','WWW'],['3','Liverpool','4','7','5','9','WWW'],['4','Real Madrid','4','5','0','9','WWW'],['5','Sporting','4','4','4','9','WWLW'],['6','Betis','4','4','3','9','WWW'],['7','Arsenal','4','6','2','7','WWD'],['8','Stuttgart','4','7','4','7','WWDL'],['9','Barcelona','4','11','6','6','WWL'],['10','Como','4','0','5','6','WLW'],['11','Man City','4','9','5','6','WLW'],['12','Club Brugge','4','9','6','6','LWW']];
let selected=games[0],filter='Todos',tab='form';const $=s=>document.querySelector(s);
function formHTML(s){return '<div class="form">'+s.split('').map(x=>`<span class="badge ${x}">${x}</span>`).join('')+'</div>'}
function renderMatches(){let q=$('#search').value.toLowerCase();let list=games.filter(g=>(filter==='Todos'||g.comp===filter)&&(`${g.home} ${g.away} ${g.comp}`.toLowerCase().includes(q)));$('#matches').innerHTML=list.length?list.map(g=>`<article class="match"><div class="matchtop"><span>${g.comp}</span><span>${g.date}</span></div><div class="matchmain"><div class="team">${g.home}</div><div class="score">${g.score}</div><div class="team">${g.away}</div></div><div class="matchfoot"><button class="details" data-id="${g.id}">Ver estadísticas →</button></div></article>`).join(''):'<div class="empty">No se encontraron partidos.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openGame(+b.dataset.id));}
function openGame(id){selected=games.find(g=>g.id===id);$('#matchTitle').textContent=selected.home+' vs '+selected.away;$('#matchComp').textContent=selected.comp+' · '+selected.date;$('#detail').classList.remove('hidden');tab='form';setTab();$('#detail').scrollIntoView({behavior:'smooth',block:'start'});}
function setTab(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let a=selected.home,b=selected.away;let c='';if(tab==='form'){c=`<h3>${a} · Últimos resultados</h3>${resultRows(a,[['01.11.26',a+' vs Rival FC','3 - 0','W'],['28.10.26','Otro FC vs '+a,'1 - 2','W'],['24.10.26',a+' vs United','1 - 1','D'],['20.10.26','City vs '+a,'2 - 0','L'],['14.10.26',a+' vs Athletic','4 - 1','W']])}<h3 style="margin-top:25px">${b} · Últimos resultados</h3>${resultRows(b,[['01.11.26',b+' vs Rival FC','0 - 2','L'],['28.10.26','Otro FC vs '+b,'3 - 1','L'],['24.10.26',b+' vs United','2 - 0','W'],['20.10.26','City vs '+b,'2 - 1','L'],['14.10.26',b+' vs Athletic','1 - 1','D']])}`;}else if(tab==='h2h'){c=`<h3>Enfrentamientos directos</h3>${resultRows(a,[['22.10.02',a+' vs '+b,'2 - 2','D'],['02.10.02',b+' vs '+a,'3 - 3','D']])}<p class="muted" style="padding:12px 16px">Historial ilustrativo de demostración. Se sustituirá por el historial real de la API.</p>`;}else if(tab==='table'){c=`<h3>Clasificación · ${selected.comp}</h3><div class="tablewrap"><table><thead><tr><th>Pos</th><th>Equipo</th><th>PJ</th><th>GF</th><th>GC</th><th>PTS</th><th>Forma</th></tr></thead><tbody>${standings.map(r=>`<tr class="${r[1]===a?'highlight':''}"><td>${r[0]}</td><td class="club">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td><b>${r[5]}</b></td><td>${formHTML(r[6])}</td></tr>`).join('')}</tbody></table></div>`;}else{c=`<h3>Datos del partido</h3><div class="facts">${[['Posesión','54%','46%'],['Tiros','14','9'],['Tiros a puerta','6','3'],['Córners','7','4'],['Tarjetas amarillas','2','3'],['Faltas','11','13']].map(x=>`<div class="fact"><b>${x[1]}</b><span>${x[0]}</span><b>${x[2]}</b></div>`).join('')}<p class="muted">Estadísticas de ejemplo. Los datos reales estarán disponibles cuando conectemos el proveedor.</p></div>`;}$('#tabContent').innerHTML=c;}
function resultRows(team,rows){return rows.map(r=>`<div class="result"><span class="date">${r[0]}</span><span class="fixture">${r[1]}</span><span class="resultscore">${r[2]}</span><span class="badge ${r[3]}">${r[3]}</span></div>`).join('')}
$('#search').addEventListener('input',renderMatches);$('#filters').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));renderMatches()});document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>{tab=x.dataset.tab;setTab()}));$('#close').onclick=()=>$('#detail').classList.add('hidden');renderMatches();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
